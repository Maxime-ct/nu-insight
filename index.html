<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NUI 27 GALLERY</title>
<meta name="description" content="NUI 27 GALLERY — a glass-cut visual feed.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#07080a; --ink:#f4f3ef; --muted:#93969e;
    --glass:rgba(255,255,255,0.055); --glass-strong:rgba(255,255,255,0.10);
    --border:rgba(255,255,255,0.14); --border-strong:rgba(255,255,255,0.30);
    --prism-a:#a9d8ff; --prism-b:#ffcdee; --prism-c:#ffe7b0;
    --radius:22px;
  }
  *{box-sizing:border-box;}
  html{ scroll-behavior:smooth; }
  body{
    margin:0;
    background:
      radial-gradient(1200px 700px at 15% -10%, rgba(169,216,255,0.05), transparent 60%),
      radial-gradient(1000px 600px at 100% 10%, rgba(255,205,238,0.045), transparent 55%),
      var(--bg);
    color:var(--ink); font-family:'Inter',sans-serif; font-weight:300;
    -webkit-font-smoothing:antialiased;
  }
  a{ color:inherit; text-decoration:none; }
  h1,h2,h3{ font-family:'Fraunces',serif; font-weight:500; margin:0; letter-spacing:-0.01em; }
  .eyebrow{ font-family:'JetBrains Mono',monospace; text-transform:uppercase; letter-spacing:0.24em; font-size:11px; color:var(--muted); }

  .glass{
    background:linear-gradient(155deg, rgba(255,255,255,0.09), rgba(255,255,255,0.02) 45%, rgba(255,255,255,0.05)), var(--glass);
    border:1px solid var(--border); border-radius:var(--radius);
    backdrop-filter: blur(18px) saturate(140%); -webkit-backdrop-filter: blur(18px) saturate(140%);
    box-shadow: 0 1px 0 rgba(255,255,255,0.16) inset, 0 30px 60px -30px rgba(0,0,0,0.7);
    position:relative;
  }

  /* ---- brand / logo fx ---- */
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand-logo{ position:relative; width:34px; height:34px; display:flex; align-items:center; justify-content:center; cursor:pointer; perspective:400px; }
  .brand-logo img{ width:100%; height:100%; object-fit:contain; transform-origin:50% 50%; transform-style:preserve-3d; }
  .brand-logo.spin-once img{ animation: spin360 1.05s cubic-bezier(.65,0,.35,1); }
  @keyframes spin360{ from{transform:rotateY(0deg);} to{transform:rotateY(360deg);} }
  .spark{ position:absolute; top:50%; left:50%; border-radius:50%; pointer-events:none; animation: sparkOut var(--dur,650ms) ease-out forwards; }
  @keyframes sparkOut{
    0%{ transform:translate(-50%,-50%) rotate(var(--ang)) translateX(0) scale(1); opacity:1; }
    100%{ transform:translate(-50%,-50%) rotate(var(--ang)) translateX(var(--dist)) scale(0.2); opacity:0; }
  }
  .brand-word{ font-family:'Fraunces',serif; font-size:16px; }

  /* ---- loader ---- */
  #loader{ position:fixed; inset:0; z-index:200; background:var(--bg); display:flex; align-items:center; justify-content:center; transition:opacity 1s ease, visibility 1s ease; }
  #loader img{ width:120px; height:auto; opacity:0; filter:drop-shadow(0 0 40px rgba(169,216,255,0.15)); animation: loaderIn 1.5s cubic-bezier(.16,1,.3,1) forwards; }
  @keyframes loaderIn{ 0%{opacity:0; transform:scale(0.8) rotate(-10deg);} 60%{opacity:1;} 100%{opacity:1; transform:scale(1) rotate(0deg);} }
  body.loaded #loader{ opacity:0; visibility:hidden; pointer-events:none; }

  /* ---- nav ---- */
  nav{
    position:fixed; top:16px; left:50%; transform:translateX(-50%); z-index:100;
    display:flex; align-items:center; gap:6px; padding:8px 10px 8px 16px;
    width:min(900px,94vw); justify-content:space-between;
  }
  .nav-links{ display:flex; align-items:center; gap:2px; overflow-x:auto; max-width:60vw; }
  .nav-links a{
    font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:0.12em; text-transform:uppercase;
    color:var(--muted); padding:9px 14px; border-radius:999px; white-space:nowrap;
    transition:color .3s ease, background .3s ease;
  }
  .nav-links a:hover{ color:var(--ink); background:rgba(255,255,255,0.07); }
  .nav-refresh{ cursor:pointer; }

  /* ---- hero ---- */
  .hero{ min-height:78svh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:140px 20px 60px; }
  .disc-wrap{ width:min(230px, 48vw); margin-bottom:26px; }
  .disc{ width:100%; filter:drop-shadow(0 24px 46px rgba(0,0,0,0.6)); animation:discFloat 7s ease-in-out infinite; }
  .disc img{ width:100%; }
  @keyframes discFloat{ 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(-10px);} }
  .hero h1{
    font-size:clamp(38px,7.5vw,80px); text-transform:uppercase; letter-spacing:0.06em; line-height:0.95;
    background:linear-gradient(120deg, #fff 0%, #fff 40%, var(--prism-a) 48%, var(--prism-b) 52%, #fff 60%, #fff 100%);
    background-size:220% 100%; -webkit-background-clip:text; background-clip:text; color:transparent;
    animation:sheen 9s ease-in-out infinite;
  }
  @keyframes sheen{ 0%{background-position:0% 0;} 50%{background-position:100% 0;} 100%{background-position:0% 0;} }
  .hero p{ margin-top:16px; color:var(--muted); font-size:15px; max-width:440px; line-height:1.7; }

  /* ---- feed ---- */
  main{ max-width:1180px; margin:0 auto; padding:20px 20px 100px; }
  .col-section{ margin-bottom:80px; scroll-margin-top:110px; }
  .col-head{ display:flex; align-items:baseline; gap:14px; margin-bottom:28px; }
  .col-head h2{ font-size:clamp(26px,3.6vw,38px); }
  .col-head .count{ font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--muted); letter-spacing:0.08em; }

  .grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:18px; }
  .g-card{ aspect-ratio:4/5; overflow:hidden; cursor:pointer; display:flex; align-items:flex-end; }
  .g-card img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; transition:transform .8s cubic-bezier(.16,1,.3,1); }
  .g-card:hover img{ transform:scale(1.06); }
  .prism-sweep{ position:relative; overflow:hidden; }
  .prism-sweep::after{
    content:""; position:absolute; inset:-40%;
    background:linear-gradient(115deg, transparent 35%, rgba(169,216,255,0.16) 46%, rgba(255,205,238,0.18) 50%, rgba(255,231,176,0.14) 54%, transparent 65%);
    transform:translateX(-60%) rotate(6deg); transition:transform 1.1s cubic-bezier(.19,1,.22,1); pointer-events:none;
  }
  .prism-sweep:hover::after{ transform:translateX(60%) rotate(6deg); }
  .g-caption{
    position:relative; z-index:2; padding:16px; width:100%;
    background:linear-gradient(0deg, rgba(0,0,0,0.6), transparent 75%);
    font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:0.05em;
    opacity:0; transform:translateY(6px); transition:opacity .4s ease, transform .4s ease;
  }
  .g-card:hover .g-caption{ opacity:1; transform:translateY(0); }

  .empty-state{
    text-align:center; padding:100px 20px; max-width:520px; margin:0 auto;
  }
  .empty-state h2{ font-size:28px; margin-bottom:14px; }
  .empty-state p{ color:var(--muted); font-size:14px; line-height:1.8; margin-bottom:26px; }
  .load-btn{
    display:inline-flex; align-items:center; gap:8px; padding:13px 22px; border-radius:999px; cursor:pointer;
    font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:0.1em; text-transform:uppercase;
    background:linear-gradient(120deg, var(--prism-a), var(--prism-b)); color:#07080a; font-weight:500;
  }

  footer{
    padding:36px 20px 46px; max-width:1180px; margin:0 auto; border-top:1px solid var(--border);
    display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:14px;
  }
  footer .foot-left{ display:flex; align-items:center; gap:10px; }
  footer .copy{ font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:0.06em; color:var(--muted); }
  footer .foot-right a, footer .foot-right span{ font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:0.08em; text-transform:uppercase; color:var(--muted); cursor:pointer; }
  footer .foot-right a:hover, footer .foot-right span:hover{ color:var(--ink); }

  #lightbox{ position:fixed; inset:0; z-index:150; background:rgba(4,5,6,0.88); backdrop-filter:blur(20px); display:none; align-items:center; justify-content:center; padding:40px; }
  #lightbox.open{ display:flex; }
  #lightbox img{ max-width:min(900px,88vw); max-height:82vh; border-radius:16px; box-shadow:0 40px 80px rgba(0,0,0,0.6); }
  #lightbox .lb-cap{ position:absolute; bottom:30px; left:50%; transform:translateX(-50%); font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--muted); }
  #lightbox .lb-close{ position:absolute; top:26px; right:30px; width:42px; height:42px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:18px; cursor:pointer; }

  @media (max-width:820px){ .grid{ grid-template-columns:repeat(2,1fr);} .nav-links{ max-width:50vw; } }
  @media (max-width:520px){ .grid{ grid-template-columns:1fr;} }
  @media (prefers-reduced-motion: reduce){ *{ animation:none !important; transition:none !important; } }
</style>
</head>

<div id="lightbox"><div class="lb-close glass" id="lbClose">×</div><img id="lbImg" src="" alt=""><div class="lb-cap" id="lbCap"></div></div>

<script>
(function(){
  const FEED_URL = 'feed.json'; // published by studio.html via the GitHub Contents API
  const POLL_MS = 6000;
  let lastRaw = null;

  window.addEventListener('load', ()=>{
    setTimeout(()=> document.body.classList.add('loaded'), 800);
    setTimeout(()=>{
      document.querySelectorAll('.brand-logo').forEach(el=> el.classList.add('spin-once'));
    }, 300);
  });

  function spawnSparks(el){
    const colors = ['var(--prism-a)','var(--prism-b)','var(--prism-c)','#ffffff'];
    for(let i=0;i<10;i++){
      const s = document.createElement('span');
      s.className='spark';
      const ang = Math.random()*360, dist = 22 + Math.random()*18, dur = 500 + Math.random()*350;
      s.style.setProperty('--ang', ang+'deg');
      s.style.setProperty('--dist', dist+'px');
      s.style.setProperty('--dur', dur+'ms');
      const size = (2+Math.random()*3);
      s.style.width = size+'px'; s.style.height = size+'px';
      s.style.background = colors[i % colors.length];
      el.appendChild(s);
      setTimeout(()=> s.remove(), dur+60);
    }
  }
  document.querySelectorAll('.brand-logo').forEach(el=>{
    el.addEventListener('mouseenter', ()=>{
      el.classList.remove('spin-once'); void el.offsetWidth; el.classList.add('spin-once');
      setTimeout(()=> spawnSparks(el), 1050);
    });
  });

  const main = document.getElementById('main');
  const navLinks = document.getElementById('navLinks');

  function escapeHtml(s){
    return (s||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }

  function renderFeed(data){
    main.innerHTML = '';
    navLinks.innerHTML = '';
    const columns = (data && data.columns) ? data.columns.filter(c => c.posts && c.posts.length) : [];

    if (columns.length === 0){
      main.innerHTML = `
        <div class="empty-state">
          <span class="eyebrow">No posts yet</span>
          <h2 style="margin-top:10px;">Nothing's live</h2>
          <p>The studio hasn't published anything yet. This page checks automatically and will fill in as soon as something goes live.</p>
          <div class="load-btn" id="emptyRefreshBtn">Check now</div>
        </div>`;
      document.getElementById('emptyRefreshBtn').addEventListener('click', ()=> checkForUpdates(true));
      return;
    }

    columns.forEach(col=>{
      const anchor = 'col-' + col.id;
      const navA = document.createElement('a');
      navA.href = '#' + anchor;
      navA.textContent = col.title;
      navLinks.appendChild(navA);

      const section = document.createElement('section');
      section.className = 'col-section';
      section.id = anchor;
      section.innerHTML = `
        <div class="col-head">
          <h2>${escapeHtml(col.title)}</h2>
          <span class="count">${col.posts.length} post${col.posts.length===1?'':'s'}</span>
        </div>
        <div class="grid"></div>
      `;
      const grid = section.querySelector('.grid');
      col.posts.forEach(post=>{
        const card = document.createElement('div');
        card.className = 'g-card glass prism-sweep';
        card.innerHTML = `<img src="${post.src}" alt=""><div class="g-caption">${escapeHtml(post.caption||'')}</div>`;
        card.addEventListener('click', ()=> openLightbox(post.src, post.caption||''));
        grid.appendChild(card);
      });
      main.appendChild(section);
    });
  }

  // ---- lightbox ----
  const lightbox = document.getElementById('lightbox');
  const lbImg = document.getElementById('lbImg');
  const lbCap = document.getElementById('lbCap');
  function openLightbox(src, cap){ lbImg.src = src; lbCap.textContent = cap; lightbox.classList.add('open'); }
  document.getElementById('lbClose').addEventListener('click', ()=> lightbox.classList.remove('open'));
  lightbox.addEventListener('click', (e)=>{ if (e.target === lightbox) lightbox.classList.remove('open'); });

  // ---- live sync: fetch the static feed.json the Studio publishes to the repo ----
  const syncStatusEl = document.getElementById('syncStatus');

  async function checkForUpdates(forceRender){
    try{
      const res = await fetch(FEED_URL + '?t=' + Date.now(), { cache: 'no-store' });
      const raw = res.ok ? await res.text() : null;
      if (forceRender || raw !== lastRaw){
        lastRaw = raw;
        renderFeed(raw ? JSON.parse(raw) : null);
      }
      if (syncStatusEl) syncStatusEl.textContent = 'Live — checked ' + new Date().toLocaleTimeString();
    }catch(e){
      if (syncStatusEl) syncStatusEl.textContent = 'Sync paused — retrying…';
    }
  }

  if (syncStatusEl) syncStatusEl.style.cursor = 'pointer';
  if (syncStatusEl) syncStatusEl.addEventListener('click', ()=> checkForUpdates(true));

  checkForUpdates(true);
  setInterval(()=> checkForUpdates(false), POLL_MS);
})();
</script>
